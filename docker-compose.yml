# Example for Docker Compose, the same as in the README.
# On TrueNAS (Apps → Discover → Install via YAML), point the volume to a folder of your own and add
# "pull_policy: always" below image, so that a restart fetches new versions.
# All connections are set later in the web interface under Settings; environment variables are optional, see .env.example.
services:
  blackbriar:
    image: ghcr.io/deraachener/blackbriar:latest
    container_name: blackbriar
    restart: unless-stopped
    # Optional: do not run as root (TrueNAS: "568:568"). The data folder must then belong to this user.
    # user: "1000:1000"
    ports:
      - "8787:8787"
    environment:
      TZ: Europe/Berlin
    volumes:
      - ./data:/data
