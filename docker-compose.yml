# Vorlage für TrueNAS (Apps → Discover → Install via YAML) oder jedes andere Docker-System.
# Den Pfad links bei "volumes" an ein eigenes Dataset anpassen. Die Verbindungen kannst du hier
# eintragen oder leer lassen und nach dem Start in der Oberfläche unter Einstellungen setzen.
services:
  blackbriar:
    image: ghcr.io/deraachener/blackbriar:latest
    container_name: blackbriar
    restart: unless-stopped
    # Optional: nicht als Root laufen (auf TrueNAS "568:568"). Der Datenordner muss dann diesem Benutzer gehören.
    # user: "1000:1000"
    ports:
      - "8787:8787"
    environment:
      PLEX_URL: http://192.168.1.10:32400
      PLEX_TOKEN: ""
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_CHAT_ID: ""
      SEERR_URL: http://192.168.1.10:5055
      SEERR_API_KEY: ""
      TZ: Europe/Berlin
    volumes:
      - /mnt/POOL/apps/blackbriar:/data
